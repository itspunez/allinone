name: Update subscription

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # manual run button
  push:
    paths:
      - sources.txt
      - aggregate.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build subscription
        env:
          # optional: private sources (one URL per line) stored as a repo secret
          EXTRA_SOURCES: ${{ secrets.EXTRA_SOURCES }}
        run: python aggregate.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output
          git diff --cached --quiet || git commit -m "update $(date -u +'%Y-%m-%d %H:%M')"
          git push
