name: Update subscription

on:
  schedule:
    - cron: "0 3 */2 * *"   # every 2 days at 03:00 UTC
  workflow_dispatch:         # manual run button
  push:
    paths:
      - sources.txt
      - filters.json
      - aggregate.py
      - realtest.py

permissions:
  contents: write

concurrency:
  group: update-sub
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Xray-core is used for the real connectivity test (realtest.py).
      # If this step fails, the build still works with the TCP-only check.
      - name: Install Xray-core
        continue-on-error: true
        env:
          XRAY_VERSION: v26.6.27     # pinned; falls back to the latest release
        run: |
          mkdir -p bin
          curl -fsSL -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip" \
            || curl -fsSL -o xray.zip "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip"
          unzip -o -q xray.zip xray -d bin
          chmod +x bin/xray
          ./bin/xray version

      - name: Build subscription
        env:
          # optional: private sources (one URL per line) stored as a repo secret
          EXTRA_SOURCES: ${{ secrets.EXTRA_SOURCES }}
        run: python aggregate.py

      # Publish on a separate branch 'sub' and overwrite it every time,
      # so the repo history does not grow on each run.
      - name: Publish to 'sub' branch
        run: |
          cd output
          git init -q -b sub
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "update $(date -u +'%Y-%m-%d %H:%M')"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" sub
